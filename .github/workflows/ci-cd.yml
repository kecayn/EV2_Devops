#despliegue
name: CI/CD Pipeline

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./front_despacho
          file: ./front_despacho/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Detener y borrar contenedor anterior de manera forzada
            sudo docker rm -f mi-app || true
            
            # Descargar la nueva imagen desde Docker Hub e iniciarla en el puerto 80
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho:latest
            sudo docker run -d --name mi-app -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho:latest