services:
  # Servicio 1: API de Ventas
  api_ventas:
    container_name: api_ventas
    image: caypereira/api_ventas:latest
    ports:
      - "8080:8080"
    environment:
      - DB_ENDPOINT=${DB_ENDPOINT}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    restart: always

  # Servicio 2: API de Despachos
  api_despachos:
    container_name: api_despachos
    image: caypereira/api_despachos:latest
    ports:
      - "8082:8081"
    environment:
      - DB_ENDPOINT=${DB_ENDPOINT}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    restart: always

  # Servicio 3: Frontend Web
  frontend_app:
    container_name: frontend_despacho
    image: caypereira/frontend_despacho:latest
    ports:
      - "80:80"
    depends_on:
      - api_ventas
      - api_despachos
    restart: always